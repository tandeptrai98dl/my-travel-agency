name: Database migrations

# The only way migrations reach the hosted Supabase projects (docs/specs/phase-6-hardening-launch.md
# decision 11, ADR-040; runbook "Deploy to production" in README.md). Never `supabase db push` from
# a developer machine.
#
# - Manual only, for one target at a time. The secrets live in the GitHub environment of the target
#   (`staging`, `production`). The real guards are the owner's environment settings, not this file:
#   BOTH environments allow only the `main` branch (a workflow edited on another branch, with the
#   `if:` and the ancestor check below removed, still cannot read their secrets), and `production`
#   has required reviewers, so a production run waits for an admin's approval.
# - Each environment's token is scoped to that one Supabase project, and the workflow refuses a
#   project whose name is not the environment's `EXPECTED_PROJECT_NAME`, so staging can never
#   reach production (a swapped ref fails twice).
# - Backup first: production refuses to run without point-in-time recovery (the restore point is
#   the time printed in the run summary). Nothing is uploaded: the repository is public, so run
#   logs are readable by anyone; the summary holds only the migration list, never schema bodies or
#   table data.
# - The approval is given before the dry run exists: approvers read the staging run's dry run of
#   the same commit (README.md "Deploy to production").
# - Then a dry run, the push (no seed: production starts with migrations plus `settings` only), and
#   a check that the migrated `public` schema gives exactly the committed
#   `src/types/database.types.ts` (types only: policies and function bodies are not compared).
#
# Secrets are passed only to the steps that need them, never echoed, and npm runs without install
# scripts. No database password is stored: with `--remote=<ref>` the CLI connects with the scoped
# token. Actions are pinned to commit SHAs (the tag is in the comment).

on:
  workflow_dispatch:
    inputs:
      target:
        description: Supabase project to migrate (its GitHub environment holds the secrets)
        type: choice
        required: true
        options:
          - staging
          - production

permissions:
  contents: read

# One run per project at a time; a second run waits instead of racing the first.
concurrency:
  group: db-migrate-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.target }}
    # A run started from any other branch is skipped before it can ask for approval. This line can
    # be edited out on another branch: the environments' `main`-only rule is what really refuses it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          # Full history, so the next step can prove the commit is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_SHA is not on main; migrations are applied only from main." >&2
            exit 1
          }
          echo "Commit $GITHUB_SHA is on main."

      - name: Check the environment's secrets and variables
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EXPECTED_PROJECT_NAME: ${{ vars.EXPECTED_PROJECT_NAME }}
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          [ -n "$EXPECTED_PROJECT_NAME" ] || missing="$missing EXPECTED_PROJECT_NAME (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing in the '$TARGET' environment:$missing (README.md \"Deployment\")." >&2
            exit 1
          fi
          # The expected name must name its own target, so the two environments cannot share one.
          case "$EXPECTED_PROJECT_NAME" in
            *"$TARGET"*) ;;
            *) echo "::error::EXPECTED_PROJECT_NAME of the '$TARGET' environment must contain '$TARGET'." >&2; exit 1 ;;
          esac
          # A project ref is 20 lower-case letters; anything else is a pasted URL or a typo.
          if ! printf '%s' "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF must be the 20-letter project ref, not a URL." >&2
            exit 1
          fi

      # The ref must be the project this environment is for: a swapped or mistyped ref is refused
      # before anything else touches a database (the scoped token would also refuse another project).
      - name: Verify the project belongs to this environment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EXPECTED_PROJECT_NAME: ${{ vars.EXPECTED_PROJECT_NAME }}
        run: |
          if ! curl -sS --fail --max-time 30 \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -o "$RUNNER_TEMP/project.json" \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF"; then
            echo "::error::Could not read the project (check SUPABASE_ACCESS_TOKEN, its projects_read scope and that it is scoped to this project)." >&2
            exit 1
          fi
          name="$(jq -r '.name // empty' "$RUNNER_TEMP/project.json")"
          rm -f "$RUNNER_TEMP/project.json"
          if [ "$name" != "$EXPECTED_PROJECT_NAME" ]; then
            echo "::error::SUPABASE_PROJECT_REF of the '$TARGET' environment is project '${name:-unknown}', not '$EXPECTED_PROJECT_NAME'. Refusing." >&2
            exit 1
          fi
          echo "Project '$name' confirmed for $TARGET."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # The Supabase CLI comes from package-lock.json (exact version and integrity). No install
      # scripts run, so no dependency can read the secrets of the steps below.
      - name: Install the Supabase CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx supabase --version

      - name: Backup check (point-in-time recovery)
        id: backup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          restore_point="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "restore_point=$restore_point" >> "$GITHUB_OUTPUT"
          # Management API "list all backups" (scope: backups_read).
          if ! curl -sS --fail --max-time 30 \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -o "$RUNNER_TEMP/backups.json" \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/backups"; then
            echo "::error::Could not read the project's backup settings (check SUPABASE_ACCESS_TOKEN and its backups_read scope)." >&2
            exit 1
          fi
          pitr="$(jq -r 'if has("pitr_enabled") then (.pitr_enabled | tostring) else "unknown" end' "$RUNNER_TEMP/backups.json")"
          latest="$(jq -r '(.physical_backup_data.latest_physical_backup_date_unix // empty)
            | (if . > 100000000000 then . / 1000 else . end) | floor | todate' "$RUNNER_TEMP/backups.json" 2>/dev/null || true)"
          rm -f "$RUNNER_TEMP/backups.json"
          echo "PITR enabled: $pitr; latest physical backup: ${latest:-unknown}"
          {
            echo "## Database migrations: $TARGET"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Started by | $GITHUB_ACTOR |"
            echo "| PITR enabled | $pitr |"
            echo "| Latest physical backup | ${latest:-unknown} |"
            echo "| **Restore point before this push (UTC)** | **$restore_point** |"
            echo
            echo "To undo this run, restore the project to the restore point (README.md \"Restore from backup\")."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TARGET" = "production" ] && [ "$pitr" != "true" ]; then
            echo "::error::Point-in-time recovery is not enabled on production. Enable the PITR add-on before migrating (decision 8)." >&2
            exit 1
          fi
          if [ "$pitr" != "true" ]; then
            echo "::warning::PITR is off on $TARGET: only its daily backup (if any) can undo this run."
          fi

      # The migration list (versions and file names, already public in the repository) before the
      # push. No schema dump and no artifact: the repository is public, and so are its run logs.
      - name: Record the migrations before the push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase migration list --remote="$SUPABASE_PROJECT_REF" > "$RUNNER_TEMP/migration-list.txt"
          cat "$RUNNER_TEMP/migration-list.txt"
          {
            echo
            echo "<details><summary>Migrations before the push (local | remote)</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/migration-list.txt"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase db push --remote="$SUPABASE_PROJECT_REF" --skip-vault --dry-run

      # Never --include-seed (no development data in hosted projects) and never --include-all (a
      # migration older than the remote's newest is refused, not applied out of order).
      - name: Apply the migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase db push --remote="$SUPABASE_PROJECT_REF" --skip-vault --yes

      - name: Check that the remote schema matches the committed types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase gen types typescript --remote="$SUPABASE_PROJECT_REF" --schema public > "$RUNNER_TEMP/remote.types.ts"
          node scripts/compare-db-types.mjs src/types/database.types.ts "$RUNNER_TEMP/remote.types.ts"

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          RESTORE_POINT: ${{ steps.backup.outputs.restore_point }}
        run: |
          {
            echo
            echo "Result: **$OUTCOME**."
            if [ "$OUTCOME" != "success" ] && [ -n "$RESTORE_POINT" ]; then
              echo
              echo "Each migration file runs in its own transaction, so a failed file left nothing behind, but"
              echo "files applied before it stay. Read the failed step, then follow README.md \"Deploy to production\""
              echo "(fix forward with a new migration; restore to $RESTORE_POINT only if data was damaged)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
