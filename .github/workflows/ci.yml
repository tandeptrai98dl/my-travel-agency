name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Placeholder values so the app can build and start in CI.
  # Real values live in Vercel and GitHub environment secrets, never in the repo.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  NEXT_TELEMETRY_DISABLED: "1"
  # Sentinel values: the build must never copy server-only values into client bundles.
  SUPABASE_SECRET_KEY: sb_secret_ci_sentinel_value_never_in_client
  CRON_SECRET: ci_cron_sentinel_never_in_client

# Runners are pinned to Ubuntu 24.04: `ubuntu-latest` moved to 26.04, where Playwright's
# system-dependency list does not install yet. Revisit when Playwright supports 26.04.
jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  database:
    name: Database (migrations, pgTAP, lint, types)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only the services the database checks need: Postgres, Auth, REST, Storage and the gateway.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,mailpit
        timeout-minutes: 10
      - name: Re-apply migrations and seed from scratch
        run: npx supabase db reset
      - name: pgTAP tests
        run: npx supabase test db
      - name: Schema lint
        run: npx supabase db lint --level warning --fail-on error
      - name: Generate database types
        run: npm run db:types
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-types
          path: src/types/database.types.ts
          retention-days: 7
      - name: Fail when the committed types are stale
        run: |
          if [ -n "$(git status --porcelain -- src/types/database.types.ts)" ]; then
            echo "src/types/database.types.ts is stale. Run npm run db:types and commit the result." >&2
            git diff --stat -- src/types/database.types.ts >&2 || true
            # The full diff, so a hand-written entry can be copied exactly from the log.
            git --no-pager diff -- src/types/database.types.ts || true
            # The generated file, base64-encoded, so it can be recovered from the log when the
            # artifact cannot be downloaded.
            echo "BEGIN database.types.ts base64"
            base64 -w 0 src/types/database.types.ts
            echo
            echo "END database.types.ts base64"
            exit 1
          fi
      - name: Seed sample users through the Auth Admin API
        run: |
          eval "$(npx supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export SUPABASE_SECRET_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          export SEED_USER_PASSWORD="ci-only-seed-password-$GITHUB_RUN_ID"
          npm run seed:users
          npm run seed:users
          roles=$(psql "$DB_URL" -tAc "select string_agg(role::text, ',' order by role) from public.profiles where email like '%@example.test'")
          echo "Seeded roles: $roles"
          test "$roles" = "customer,sales,sales_manager,operator,accountant,editor,admin"

  build-e2e:
    name: Build and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # E2E runs against a real local stack: sign-in, roles, MFA and the health check. Mailpit
      # stays on: the staff invitation test reads the invitation email (ADR-032).
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime
        timeout-minutes: 10
      - name: Read local Supabase settings
        id: supabase
        run: |
          eval "$(npx supabase status -o env)"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "publishable_key=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_OUTPUT"
          echo "service_key=${SERVICE_ROLE_KEY:-$SECRET_KEY}" >> "$GITHUB_OUTPUT"
          echo "mail_url=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}" >> "$GITHUB_OUTPUT"
      - name: Seed sample users
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.service_key }}
          SEED_USER_PASSWORD: ci-only-seed-password-${{ github.run_id }}
        run: npm run seed:users
      # The build keeps the sentinel SUPABASE_SECRET_KEY and CRON_SECRET from the workflow env, so
      # the leak check below can look for them. The E2E server gets the real service key at run
      # time (media uploads use the service role for Storage, ADR-023).
      # A fake public Sentry DSN, so the browser SDK is built in and its scrubbing can be tested
      # (monitoring.spec.ts intercepts its requests; a stray browser error in another spec would be
      # rejected by Sentry, since the key is fake). No server DSN is set.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
          NEXT_PUBLIC_SENTRY_DSN: https://e2epublickey@o0.ingest.sentry.io/0
          SHOW_DESIGN_SYSTEM: "true"
        run: npm run build
      - name: Check that server-only values did not leak into client bundles
        run: |
          if grep -rlE "sb_secret_ci_sentinel_value_never_in_client|ci_cron_sentinel_never_in_client" .next/static; then
            echo "A server-only environment value was found in client bundles." >&2
            exit 1
          fi
      # Initial JS on public pages (Phase 3 spec decision 16): a warning until PR M enforces it.
      - name: Check the initial JavaScript budget
        run: node scripts/check-js-budget.mjs
      # Cache the downloaded browser per Playwright version and runner image,
      # so most runs skip the download and only install system libraries.
      - name: Get Playwright version and runner image
        id: playwright
        run: |
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      # apt mirrors on hosted runners occasionally stall; retry each install with its own timeout.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            timeout -k 15 240 npx playwright install --with-deps chromium && exit 0
            echo "Attempt $attempt failed or timed out; retrying." >&2
            # `timeout` stops npx but not the apt-get it started, which keeps the dpkg lock and
            # makes every retry fail. Let it finish (up to 2 min), then stop it.
            for wait in $(seq 1 60); do
              sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || break
              sleep 2
            done
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            # A killed apt/dpkg run can leave the package database half-configured.
            sudo dpkg --configure -a || true
          done
          exit 1
        timeout-minutes: 20
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          for attempt in 1 2 3; do
            timeout -k 15 180 npx playwright install-deps chromium && exit 0
            echo "Attempt $attempt failed or timed out; retrying." >&2
            # `timeout` stops npx but not the apt-get it started, which keeps the dpkg lock and
            # makes every retry fail. Let it finish (up to 2 min), then stop it.
            for wait in $(seq 1 60); do
              sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || break
              sleep 2
            done
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            # A killed apt/dpkg run can leave the package database half-configured.
            sudo dpkg --configure -a || true
          done
          exit 1
        timeout-minutes: 16
      - name: E2E tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
          SEED_USER_PASSWORD: ci-only-seed-password-${{ github.run_id }}
          NEXT_PUBLIC_SENTRY_DSN: https://e2epublickey@o0.ingest.sentry.io/0
          # Server-only, read at run time by `next start`; never part of the build output.
          SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.service_key }}
          # Test setup only (generating email-link tokens).
          E2E_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          E2E_SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.service_key }}
          # Mailpit's API, for the staff invitation email (staff.spec.ts).
          E2E_MAIL_URL: ${{ steps.supabase.outputs.mail_url }}
          # Serves /admin/design-system in the production build so axe can check it.
          SHOW_DESIGN_SYSTEM: "true"
        run: npm run test:e2e
        timeout-minutes: 8
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
